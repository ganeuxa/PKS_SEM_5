# Параметры JDBC-подключения к базе данных PostgreSQL из КР 1 (база autosalon).
# Пароль хранится здесь, а не в Java-коде. Если запускаете из другой папки, положите рядом свой
# database.properties: его значения переопределят значения из этого файла.

# Вариант 1. Локальный PostgreSQL (как в КР 1): укажите пароль пользователя postgres.
db.url=jdbc:postgresql://localhost:5432/autosalon
db.user=postgres
db.password=postgres

# Вариант 2. База autosalon в Docker (docker compose up -d в папке autosalon-javafx):
# опубликованный порт 55433, пользователь и пароль заданы в docker-compose.yml.
#db.url=jdbc:postgresql://localhost:55433/autosalon
#db.user=autosalon_app
#db.password=autosalon_app
