# Параметры подключения к PostgreSQL.
# Укажите пароль пользователя postgres, который задали при установке PostgreSQL.
# Если запускаете готовый jar, можно положить рядом с ним (в папку запуска) свой файл db.properties:
# его значения переопределят значения из этого файла.
db.url=jdbc:postgresql://localhost:5432/autosalon
db.user=postgres
db.password=postgres
